# === nginx: seventwo — seventwo.tech (Next.js seventwo-frontend) ===
# App Node standalone en contenedor: 127.0.0.1:4001 (no es estático: proxy de
# Next 16 para /area-cliente, useSearchParams, etc.). www.seventwo.tech
# redirige a seventwo.tech (dominio canónico, coincide con metadataBase).
# Certificado único para ambos nombres: /etc/letsencrypt/live/seventwo.tech/
# Lo instala .github/workflows/deploy.yml en /etc/nginx/sites-available/seventwo.

# --- HTTP → HTTPS (ambos nombres) ---
server {
    listen 80;
    listen [::]:80;
    server_name seventwo.tech www.seventwo.tech;
    return 301 https://seventwo.tech$request_uri;
}

# --- www → dominio canónico ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.seventwo.tech;

    ssl_certificate /etc/letsencrypt/live/seventwo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seventwo.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://seventwo.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name seventwo.tech;

    ssl_certificate /etc/letsencrypt/live/seventwo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seventwo.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets Next (/_next/static) con hash: caché agresiva
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4001;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
